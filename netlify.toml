[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # Email templates and the packing-slip wordmark are read at runtime. esbuild
  # only bundles imported code, so these assets must be included explicitly.
  included_files = ["email-templates/**", "public/logo-wide.png"]

# ─── Security headers ────────────────────────────────────────────────────────
# All headers below are enforcing. The CSP ran in Report-Only mode first and
# produced no violations on a real browse-through before being switched on.
#
# If a future change ever needs a new third-party domain (a new analytics tool,
# payment widget, font host, etc.) it must be added to the matching directive
# below or the browser will silently block it. To temporarily disable the CSP,
# rename the key to "Content-Security-Policy-Report-Only".
[[headers]]
  for = "/*"
  [headers.values]
    # Stops the site being embedded in an iframe (clickjacking on checkout).
    X-Frame-Options = "DENY"
    # Stops browsers guessing file types (MIME sniffing).
    X-Content-Type-Options = "nosniff"
    # Don't leak full URLs to third-party sites in the Referer header.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Explicitly disable device APIs the site never uses.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # Force HTTPS for a year, including subdomains. preload is omitted until
    # the owner submits the domain to the HSTS preload list.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # script-src has no 'unsafe-inline': the one inline script (the Google
    # Analytics bootstrap) moved into the bundle, so the policy can refuse
    # injected inline scripts outright. 'unsafe-inline' stays on style-src for
    # now because every component in site_1.jsx styles itself with a style={{}}
    # prop; removing it means migrating all of them to classes first.
    # gtag is loaded only after a visitor accepts analytics. DoubleClick and
    # the EmailJS browser API are not used. Cloudflare Turnstile is used on
    # checkout and is verified in create-order, not in the browser alone.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://challenges.cloudflare.com; connect-src 'self' https://nmafhetkofrekabqawgb.supabase.co https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com https://challenges.cloudflare.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; frame-src https://challenges.cloudflare.com; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'"

# Vite fingerprints built assets in their filenames. They can be cached for a
# year because a changed file always receives a new URL.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
