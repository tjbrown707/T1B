[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# ─── Security headers ────────────────────────────────────────────────────────
# All headers below are enforcing. The CSP ran in Report-Only mode first and
# produced no violations on a real browse-through before being switched on.
#
# If a future change ever needs a new third-party domain (a new analytics tool,
# payment widget, font host, etc.) it must be added to the matching directive
# below or the browser will silently block it. To temporarily disable the CSP,
# rename the key to "Content-Security-Policy-Report-Only".
[[headers]]
  for = "/*"
  [headers.values]
    # Stops the site being embedded in an iframe (clickjacking on checkout).
    X-Frame-Options = "DENY"
    # Stops browsers guessing file types (MIME sniffing).
    X-Content-Type-Options = "nosniff"
    # Don't leak full URLs to third-party sites in the Referer header.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Explicitly disable device APIs the site never uses.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # Force HTTPS for a year, including subdomains.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; connect-src 'self' https://*.supabase.co https://api.emailjs.com https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com https://stats.g.doubleclick.net; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'"
